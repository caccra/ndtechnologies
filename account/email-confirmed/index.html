<script>
  // Supabase's confirmation link verifies the token server-side, then lands
  // the browser here. Depending on how the project's email flow is
  // configured, that either (a) establishes a live session right away, or
  // (b) just marks the account confirmed with no session — this page
  // handles both, since there's no reliable way to know which in advance.
  (async function () {
    const wrap = document.getElementById('confirmWrap');

    // Supabase Auth also uses this same redirect target for other link
    // types (invite, magic link, password recovery) — surface those
    // distinctly rather than always claiming "email confirmed".
    const params = new URLSearchParams(window.location.hash.replace(/^#/, '') || window.location.search);
    const errorDescription = params.get('error_description');

    if (errorDescription) {
      wrap.innerHTML = `
        <div class="eyebrow" style="justify-content:center;display:flex;">Link Problem</div>
        <h3>This link didn't work</h3>
        <p>${errorDescription.replace(/[<>&"]/g, '')}</p>
        <p style="margin-top:18px;"><a href="/account/register/">Try registering again</a> or <a href="/account/login/">log in</a> if you already confirmed a different way.</p>
      `;
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();

    if (session) {
      wrap.innerHTML = `
        <div class="eyebrow" style="justify-content:center;display:flex;">All Set</div>
        <h3>Email confirmed — you're logged in</h3>
        <p>Your account is ready to go.</p>
        <a href="/account/" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px;">Go to My Account →</a>
      `;
    } else {
      wrap.innerHTML = `
        <div class="eyebrow" style="justify-content:center;display:flex;">All Set</div>
        <h3>Your email is confirmed</h3>
        <p>You can now log in with your email and password.</p>
        <a href="/account/login/" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px;">Go to Login →</a>
      `;
    }
  })();
</script>
