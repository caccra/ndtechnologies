<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in… — ND Electronic Technologies Ltd</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .sso-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .sso-wrap p { color: var(--text-muted); font-size: 14px; margin-top: 10px; }
  .sso-wrap a { color: var(--ink); }
</style>
</head>
<body data-page="account">

<div class="sso-wrap">
  <div>
    <h3 id="ssoHeading">Signing you in…</h3>
    <p id="ssoMessage">Just a moment.</p>
  </div>
</div>

<script src="/assets/cart.js"></script>
<script src="/assets/supabase-config.js"></script>
<script src="/assets/clerk-config.js"></script>
<script>
  /* Landing page for the Google/Facebook OAuth redirect started on
     account/login/ (see its startOAuth() — redirectUrl points here).
     Clerk finishes the OAuth handshake and, per its default vanilla-JS
     navigate behavior, sends the browser on to the redirectUrlComplete that
     was passed when the flow started. The manual redirect below is a
     fallback in case that doesn't fire. */
  (async function () {
    const heading = document.getElementById('ssoHeading');
    const message = document.getElementById('ssoMessage');
    try {
      const clerk = await loadClerk();
      await clerk.handleRedirectCallback();
      await claimPendingOrder();

      // Fallback only — handleRedirectCallback's own navigation should have
      // already left this page by the time we get here on success.
      window.location.href = clerk.user ? '/account/' : '/account/login/';
    } catch (err) {
      console.error('OAuth sign-in failed:', err);
      heading.textContent = 'Could not complete sign-in';
      message.innerHTML = 'Something went wrong finishing that sign-in. <a href="/account/login/">Try again</a>, or call/WhatsApp us on 0704 399665.';
    }
  })();
</script>
</body>
</html>
