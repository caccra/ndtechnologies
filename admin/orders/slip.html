<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packing Slip — ND Electronic Technologies Ltd</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; color: #17212e; margin: 0; padding: 40px; background: #f4f5f3; font-size: 14px; }
    .slip { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #dfe1dc; border-radius: 10px; padding: 40px; }
    .slip-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #17212e; padding-bottom: 18px; margin-bottom: 24px; }
    .slip-head h1 { font-family: 'Poppins', sans-serif; font-size: 19px; margin: 0 0 4px; }
    .slip-head p { margin: 0; color: #6b7280; font-size: 12.5px; line-height: 1.5; }
    .slip-title { text-align: right; }
    .slip-title .label { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    .slip-title .ref { font-size: 12px; color: #6b7280; margin-top: 4px; font-family: monospace; }
    .slip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 26px; }
    .slip-field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: #6b7280; font-weight: 700; margin-bottom: 4px; }
    .slip-field div { font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #6b7280; border-bottom: 1.5px solid #17212e; padding: 0 0 8px; }
    td { padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    td.qty, th.qty { text-align: center; width: 60px; }
    .notes-box { background: #f9f9f7; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; font-size: 13px; margin-bottom: 20px; }
    .slip-foot { text-align: center; font-size: 12px; color: #6b7280; margin-top: 30px; }
    .toolbar { max-width: 720px; margin: 0 auto 16px; text-align: right; }
    .toolbar button { font-family: 'Jost', sans-serif; font-weight: 600; background: #17212e; color: #fff; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; }
    #err { max-width: 720px; margin: 40px auto; text-align: center; color: #b3261e; }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .slip { border: none; padding: 0; }
    }
  </style>
</head>

<body>
  <div class="toolbar"><button onclick="window.print()">Print</button></div>
  <div id="err" style="display:none;"></div>
  <div class="slip" id="slip" style="display:none;">
    <div class="slip-head">
      <div>
        <h1>ND Electronic Technologies Ltd</h1>
        <p>Kampala, Uganda<br />sales@ndelectronictechnologies.com</p>
      </div>
      <div class="slip-title">
        <div class="label">Packing Slip</div>
        <div class="ref" id="slipRef"></div>
      </div>
    </div>

    <div class="slip-grid">
      <div class="slip-field"><label>Deliver To</label><div id="slipName"></div></div>
      <div class="slip-field"><label>Phone</label><div id="slipPhone"></div></div>
      <div class="slip-field" style="grid-column:1/-1;"><label>Delivery Address</label><div id="slipAddress"></div></div>
      <div class="slip-field"><label>Order Date</label><div id="slipDate"></div></div>
      <div class="slip-field"><label>Payment Method</label><div id="slipPayment"></div></div>
    </div>

    <table>
      <thead><tr><th>Item</th><th class="qty">Qty</th></tr></thead>
      <tbody id="slipItems"></tbody>
    </table>

    <div class="notes-box" id="slipNotesBox" style="display:none;">
      <strong>Notes:</strong> <span id="slipNotes"></span>
    </div>

    <div class="slip-foot">Thank you for your order — call or WhatsApp +256 704 399665 with any questions.</div>
  </div>

  <script src="/assets/supabase-config.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    (async function () {
      const { data: { session } } = await supabaseAuthClient.auth.getSession();
      if (!session) { window.location.href = '/admin/login/'; return; }
      const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
      if (!profile || !profile.is_admin) { window.location.href = '/admin/login/'; return; }

      const id = new URLSearchParams(window.location.search).get('id');
      const err = document.getElementById('err');
      if (!id) { err.textContent = 'No order specified.'; err.style.display = 'block'; return; }

      const { data: o, error } = await supabaseClient
        .from('orders')
        .select('*, order_items(product_name, quantity)')
        .eq('id', id)
        .maybeSingle();

      if (error || !o) {
        err.textContent = 'Could not load order' + (error ? ': ' + error.message : '.');
        err.style.display = 'block';
        return;
      }

      document.getElementById('slipRef').textContent = 'Order ' + o.id;
      document.getElementById('slipName').textContent = o.customer_name || '—';
      document.getElementById('slipPhone').textContent = o.customer_phone || '—';
      document.getElementById('slipAddress').textContent = o.delivery_address || '—';
      document.getElementById('slipDate').textContent = new Date(o.created_at).toLocaleDateString('en-UG', { dateStyle: 'long' });
      document.getElementById('slipPayment').textContent = o.payment_provider === 'cod' ? 'Cash on Delivery' : 'Paid Online';

      document.getElementById('slipItems').innerHTML = (o.order_items || []).map(i =>
        `<tr><td>${esc(i.product_name)}</td><td class="qty">${i.quantity}</td></tr>`
      ).join('') || '<tr><td colspan="2">No items on record.</td></tr>';

      if (o.notes) {
        document.getElementById('slipNotes').textContent = o.notes;
        document.getElementById('slipNotesBox').style.display = 'block';
      }

      document.getElementById('slip').style.display = 'block';
    })();
  </script>
</body>

</html>
