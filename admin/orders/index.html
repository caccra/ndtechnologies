<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Admin — ND Electronic Technologies Ltd</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="stylesheet" href="/assets/admin.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-shell">
  <div class="admin-topbar">
    <a href="/" class="brand" id="navBrand"></a>
    <div class="admin-topbar-right">
      <a href="/admin/products/" style="color:rgba(255,255,255,.7);font-size:13px;font-weight:600;text-decoration:none;">Products</a>
      <a href="/admin/orders/" style="color:var(--amber);font-size:13px;font-weight:600;text-decoration:none;">Orders</a>
      <span id="userEmail"></span>
      <button id="signOutBtn" class="btn btn-outline-dark" style="padding:8px 16px;font-size:12.5px;">Sign Out</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="admin-head">
      <div>
        <h1>Orders</h1>
        <p>Orders placed through the shop. Payment status updates automatically once verified.</p>
      </div>
    </div>

    <div class="admin-panel">
      <div class="admin-table-wrap">
        <table class="admin-table admin-orders-table">
          <thead>
            <tr><th>Date</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
        <div class="admin-empty" id="emptyState" style="display:none;">No orders yet.</div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/supabase-config.js"></script>
<script>
  (async function guard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = '/admin/login/'; return; }
    document.getElementById('userEmail').textContent = session.user.email;
  })();

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/admin/login/';
  });

  function ugx(n) { return 'UGX ' + Number(n).toLocaleString('en-UG'); }
  function fmtDate(iso) { return new Date(iso).toLocaleString('en-UG', { dateStyle: 'medium', timeStyle: 'short' }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(product_name, quantity)')
      .order('created_at', { ascending: false });

    const body = document.getElementById('ordersBody');
    const empty = document.getElementById('emptyState');
    body.innerHTML = '';

    if (error) { console.error(error); return; }
    if (!orders.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    orders.forEach((o) => {
      const items = (o.order_items || []).map(i => `${esc(i.product_name)} ×${i.quantity}`).join(', ');
      const isCod = o.payment_provider === 'cod';
      const canFulfill = o.status === 'paid' || (isCod && o.status === 'pending');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fmtDate(o.created_at)}</td>
        <td>${esc(o.customer_name)}</td>
        <td><a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></td>
        <td>${items || '—'}</td>
        <td class="total">${ugx(o.total)}</td>
        <td><span class="admin-status-pill ${isCod ? 'off' : 'on'}">${isCod ? 'Cash on Delivery' : 'Online'}</span></td>
        <td><span class="order-status ${o.status}">${o.status}</span></td>
        <td>
          <div class="admin-row-actions">
            ${canFulfill ? `<button data-action="fulfill" data-id="${o.id}">Mark Fulfilled</button>` : ''}
          </div>
        </td>`;
      body.appendChild(tr);
    });

    body.querySelectorAll('button[data-action="fulfill"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supabaseClient.from('orders').update({ status: 'fulfilled' }).eq('id', btn.dataset.id);
        loadOrders();
      });
    });
  }

  loadOrders();
</script>
<script src="/assets/script.js" defer></script>
</body>
</html>
