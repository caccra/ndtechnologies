<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Admin — ND Electronic Technologies Ltd</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="stylesheet" href="/assets/admin.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-shell">
  <div class="admin-sidebar">
    <a href="/" class="brand" id="navBrand"></a>
    <div class="admin-sidebar-tag">Admin Panel</div>
    <div class="admin-global-search" id="globalSearchBox">
      <svg><use href="#ico-search"/></svg>
      <input type="text" id="globalSearchInput" placeholder="Search everything…" autocomplete="off" />
      <div id="globalSearchResults"></div>
    </div>
    <div class="admin-nav">
      <a href="/admin/"><svg><use href="#ico-dashboard"/></svg><span>Dashboard</span></a>
      <a href="/admin/products/"><svg><use href="#ico-box"/></svg><span>Products</span></a>
      <a href="/admin/coupons/"><svg><use href="#ico-tag"/></svg><span>Coupons</span></a>
      <a href="/admin/orders/" class="active"><svg><use href="#ico-cash"/></svg><span>Orders</span></a>
      <a href="/admin/leads/"><svg><use href="#ico-mail"/></svg><span>Leads</span></a>
      <a href="/admin/reviews/"><svg><use href="#ico-star"/></svg><span>Reviews</span></a>
      <a href="/admin/finance/"><svg><use href="#ico-chart"/></svg><span>Finance</span></a>
      <a href="/admin/customers/"><svg><use href="#ico-user"/></svg><span>Customers</span></a>
    </div>
    <div class="admin-sidebar-foot">
      <div class="admin-sidebar-user" id="userEmail"></div>
      <button id="signOutBtn" class="btn btn-outline-dark" style="padding:8px 16px;font-size:12.5px;">Sign Out</button>
    </div>
  </div>
  <div class="admin-main">
    <div class="admin-head">
      <div>
        <h1>Orders</h1>
        <p>Orders placed through the shop. Payment status updates automatically once verified.</p>
      </div>
      <input type="search" id="orderSearch" class="admin-search-input" placeholder="Search customer or phone…" />
    </div>

    <div class="admin-filter-tabs" id="statusTabs">
      <button class="admin-filter-tab active" data-status="">All</button>
      <button class="admin-filter-tab" data-status="pending">Pending</button>
      <button class="admin-filter-tab" data-status="paid">Paid</button>
      <button class="admin-filter-tab" data-status="in_progress">In Progress</button>
      <button class="admin-filter-tab" data-status="dispatched">Dispatched</button>
      <button class="admin-filter-tab" data-status="fulfilled">Fulfilled</button>
      <button class="admin-filter-tab" data-status="failed">Failed</button>
      <button class="admin-filter-tab" data-status="cancelled">Cancelled</button>
    </div>

    <div class="admin-toolbar">
      <span class="admin-toolbar-label">From</span>
      <input type="date" id="dateFrom" class="admin-date-input" />
      <span class="admin-toolbar-label">To</span>
      <input type="date" id="dateTo" class="admin-date-input" />
      <button type="button" class="admin-export-btn" id="exportBtn"><svg><use href="#ico-download"/></svg>Export CSV</button>
    </div>

    <div class="admin-bulk-bar" id="bulkBar" style="display:none;">
      <span id="bulkCount"></span>
      <select id="bulkStatusSelect">
        <option value="" disabled selected>Mark selected as…</option>
        <option value="in_progress">In Progress</option>
        <option value="dispatched">Dispatched</option>
        <option value="fulfilled">Fulfilled / Complete</option>
        <option value="failed">Failed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button type="button" class="btn btn-primary" id="bulkApplyBtn" style="padding:8px 16px;font-size:12.5px;">Apply</button>
      <button type="button" class="btn btn-outline-navy" id="bulkClearBtn" style="padding:8px 16px;font-size:12.5px;">Clear selection</button>
    </div>

    <div class="admin-panel">
      <div class="admin-table-wrap">
        <table class="admin-table admin-orders-table">
          <thead>
            <tr><th><input type="checkbox" id="selectAllBox" /></th><th></th><th>Date</th><th>Customer</th><th>Phone</th><th>Items</th><th>Delivery Address</th><th>Notes</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
        <div class="admin-empty" id="emptyState" style="display:none;">No orders yet.</div>
        <div class="admin-pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/supabase-config.js"></script>
<script src="/assets/admin.js"></script>
<script>initGlobalSearch(supabaseClient);</script>
<script>
  (async function guard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = '/admin/login/'; return; }
    // Session alone isn't enough — any registered customer has one. Confirm
    // this account is actually flagged admin before showing anything here;
    // RLS blocks the real data either way, but a non-admin shouldn't even
    // see the dashboard shell.
    const { data: profile } = await supabaseClient.from('profiles').select('is_admin, role').eq('id', session.user.id).maybeSingle();
    if (!profile || !profile.is_admin) {
      await supabaseClient.auth.signOut();
      window.location.href = '/admin/login/';
      return;
    }
    document.getElementById('userEmail').textContent = session.user.email;
    if (profile.role !== 'owner') {
      const financeLink = document.querySelector('.admin-nav a[href="/admin/finance/"]');
      if (financeLink) financeLink.remove();
    }
  })();

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/admin/login/';
  });

  function ugx(n) { return 'UGX ' + Number(n).toLocaleString('en-UG'); }
  function fmtDate(iso) { return new Date(iso).toLocaleString('en-UG', { dateStyle: 'medium', timeStyle: 'short' }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  const STATUS_LABELS = {
    pending: 'Pending',
    paid: 'Paid',
    in_progress: 'In Progress',
    dispatched: 'Dispatched',
    fulfilled: 'Fulfilled / Complete',
    failed: 'Failed',
    cancelled: 'Cancelled',
  };
  const ACTION_OPTIONS = ['in_progress', 'dispatched', 'fulfilled', 'failed', 'cancelled'];

  let ALL_ORDERS = [];
  let activeStatus = '';
  let expandedId = null;
  let currentPage = 1;
  const PAGE_SIZE = 5;
  let selectedIds = new Set();
  let editingDetailsId = null;
  let refundFormOpenId = null;

  async function loadOrders() {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(product_name, quantity, unit_price, line_total, products(image_url))')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      showToast('Could not load orders: ' + error.message, 'error');
      const empty = document.getElementById('emptyState');
      empty.textContent = 'Could not load orders: ' + error.message;
      empty.style.display = 'block';
      return;
    }
    ALL_ORDERS = orders || [];
    renderOrders();
  }

  function visibleOrders() {
    const q = document.getElementById('orderSearch').value.trim().toLowerCase();
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    return ALL_ORDERS.filter(o => {
      if (activeStatus && o.status !== activeStatus) return false;
      if (from && o.created_at < from) return false;
      if (to && o.created_at.slice(0, 10) > to) return false;
      if (!q) return true;
      return [o.customer_name, o.customer_phone].some(v => (v || '').toLowerCase().includes(q));
    });
  }

  function renderOrders() {
    const body = document.getElementById('ordersBody');
    const empty = document.getElementById('emptyState');
    body.innerHTML = '';

    const filtered = visibleOrders();
    if (!filtered.length) {
      empty.style.display = 'block';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    const orders = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    orders.forEach((o) => {
      const items = (o.order_items || []).map(i => `${esc(i.product_name)} ×${i.quantity}`).join(', ');
      const isCod = o.payment_provider === 'cod';
      const tr = document.createElement('tr');
      tr.className = 'admin-row-clickable' + (o.id === expandedId ? ' expanded' : '');
      tr.dataset.id = o.id;
      tr.innerHTML = `
        <td><input type="checkbox" class="order-select-box" data-id="${o.id}" ${selectedIds.has(String(o.id)) ? 'checked' : ''} /></td>
        <td><svg class="admin-expand-chevron"><use href="#ico-chevron"/></svg></td>
        <td>${fmtDate(o.created_at)}</td>
        <td>${esc(o.customer_name)}</td>
        <td><a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></td>
        <td class="admin-order-items" title="${esc(items)}">${items || '—'}</td>
        <td class="admin-order-address" title="${esc(o.delivery_address)}">${esc(o.delivery_address) || '—'}</td>
        <td class="admin-order-notes" title="${esc(o.notes)}">${esc(o.notes) || '—'}</td>
        <td class="total">${ugx(o.total)}</td>
        <td><span class="admin-status-pill ${isCod ? 'off' : 'on'}">${isCod ? 'Cash on Delivery' : 'Online'}</span></td>
        <td><span class="order-status ${o.status}">${esc(STATUS_LABELS[o.status] || o.status)}</span></td>
        <td>
          <div class="admin-row-actions">
            <select class="order-action-select" data-id="${o.id}">
              <option value="" disabled selected>Update status…</option>
              ${ACTION_OPTIONS.map(s => `<option value="${s}">${esc(STATUS_LABELS[s])}</option>`).join('')}
            </select>
            <button type="button" class="order-print-btn" data-id="${o.id}" title="Print packing slip">🖨</button>
            <button type="button" class="order-print-btn" data-receipt-id="${o.id}" title="View / print payment receipt">🧾</button>
          </div>
        </td>`;
      body.appendChild(tr);

      if (o.id === expandedId) body.appendChild(detailRow(o));
    });

    body.querySelectorAll('tr.admin-row-clickable').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('select') || e.target.closest('a') || e.target.closest('input') || e.target.closest('button')) return;
        expandedId = expandedId === row.dataset.id ? null : row.dataset.id;
        renderOrders();
      });
    });

    body.querySelectorAll('input.order-select-box').forEach(box => {
      box.addEventListener('click', (e) => e.stopPropagation());
      box.addEventListener('change', () => {
        if (box.checked) selectedIds.add(box.dataset.id); else selectedIds.delete(box.dataset.id);
        updateBulkBar();
      });
    });

    body.querySelectorAll('button.order-print-btn[data-id]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.open('/admin/orders/slip.html?id=' + encodeURIComponent(btn.dataset.id), '_blank');
      });
    });

    body.querySelectorAll('button.order-print-btn[data-receipt-id]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.open('/admin/orders/receipt.html?id=' + encodeURIComponent(btn.dataset.receiptId), '_blank');
      });
    });

    body.querySelectorAll('select.order-action-select').forEach(sel => {
      sel.addEventListener('click', (e) => e.stopPropagation());
      sel.addEventListener('change', async () => {
        const newStatus = sel.value;
        if (!newStatus) return;
        sel.disabled = true;
        await applyStatus(sel.dataset.id, newStatus);
        loadOrders();
      });
    });

    const selectAll = document.getElementById('selectAllBox');
    selectAll.checked = orders.length > 0 && orders.every(o => selectedIds.has(String(o.id)));
    selectAll.onclick = () => {
      if (selectAll.checked) orders.forEach(o => selectedIds.add(String(o.id)));
      else orders.forEach(o => selectedIds.delete(String(o.id)));
      renderOrders();
    };

    updateBulkBar();
    renderPagination(filtered.length, totalPages);
  }

  async function applyStatus(orderId, newStatus) {
    const { data, error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId).select();
    if (error) {
      showToast('Could not update status: ' + error.message, 'error');
      return false;
    } else if (!data || !data.length) {
      showToast('Nothing was updated — check your admin permissions.', 'error');
      return false;
    }
    // order_events is now populated automatically by a DB trigger on any
    // orders.status change (see schema.sql) — powers the customer
    // dashboard's Inbox without a manual insert here.
    return true;
  }

  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const count = selectedIds.size;
    bar.style.display = count ? 'flex' : 'none';
    document.getElementById('bulkCount').textContent = `${count} order${count === 1 ? '' : 's'} selected`;
  }

  document.getElementById('bulkClearBtn').addEventListener('click', () => { selectedIds.clear(); renderOrders(); });
  document.getElementById('bulkApplyBtn').addEventListener('click', async () => {
    const status = document.getElementById('bulkStatusSelect').value;
    if (!status) { showToast('Choose a status to apply first.', 'error'); return; }
    const ok = await confirmDialog(`Mark ${selectedIds.size} order${selectedIds.size === 1 ? '' : 's'} as ${STATUS_LABELS[status]}?`);
    if (!ok) return;
    const btn = document.getElementById('bulkApplyBtn');
    btn.disabled = true;
    btn.textContent = 'Applying…';
    let okCount = 0;
    for (const id of selectedIds) { if (await applyStatus(id, status)) okCount++; }
    btn.disabled = false;
    btn.textContent = 'Apply';
    showToast(`${okCount} of ${selectedIds.size} order${selectedIds.size === 1 ? '' : 's'} updated.`);
    selectedIds.clear();
    document.getElementById('bulkStatusSelect').value = '';
    loadOrders();
  });

  function renderPagination(totalCount, totalPages) {
    const host = document.getElementById('pagination');
    if (totalPages <= 1) { host.innerHTML = ''; return; }
    host.innerHTML = `
      <button type="button" id="pagePrev" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>
      <span>Page ${currentPage} of ${totalPages} (${totalCount} order${totalCount === 1 ? '' : 's'})</span>
      <button type="button" id="pageNext" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
    document.getElementById('pagePrev').addEventListener('click', () => { currentPage--; renderOrders(); });
    document.getElementById('pageNext').addEventListener('click', () => { currentPage++; renderOrders(); });
  }

  function detailRow(o) {
    const tr = document.createElement('tr');
    tr.className = 'admin-detail-row';
    const itemsHtml = (o.order_items || []).map(i => `
      <div class="admin-detail-item">
        ${i.products && i.products.image_url ? `<img src="${esc(i.products.image_url)}" alt="">` : ''}
        <span>${esc(i.product_name)}</span>
        <span class="qty">×${i.quantity}</span>
        <span class="price">${ugx(i.line_total)}</span>
      </div>`).join('') || '<p style="color:var(--text-muted);">No items on record.</p>';

    const isEditing = editingDetailsId === o.id;
    const detailsHtml = isEditing ? `
      <div class="admin-detail-field"><label>Phone</label><input type="text" id="editPhone" value="${esc(o.customer_phone)}" /></div>
      <div class="admin-detail-field" style="margin-top:12px;"><label>Full Delivery Address</label><textarea id="editAddress" rows="2">${esc(o.delivery_address) || ''}</textarea></div>
      <div class="admin-detail-field" style="margin-top:12px;"><label>Notes</label><textarea id="editNotes" rows="2">${esc(o.notes) || ''}</textarea></div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button type="button" class="btn btn-primary" id="saveDetailsBtn" style="padding:8px 16px;font-size:12.5px;">Save</button>
        <button type="button" class="btn btn-outline-navy" id="cancelDetailsBtn" style="padding:8px 16px;font-size:12.5px;">Cancel</button>
      </div>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:8px;">Only delivery details are editable here — line items and pricing are locked once an order is placed to keep the financial record intact.</p>
    ` : `
      <div class="admin-detail-field"><label>Full Delivery Address</label><div>${esc(o.delivery_address) || '—'}</div></div>
      <div class="admin-detail-field" style="margin-top:12px;"><label>Notes</label><div>${esc(o.notes) || '—'}</div></div>
      <button type="button" id="editDetailsBtn" style="margin-top:10px;background:none;border:none;color:var(--navy,#1a2b4c);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;">Edit delivery details</button>
    `;

    const refundedAmt = Number(o.refunded_amount || 0);
    const refundFormOpen = refundFormOpenId === o.id;
    const refundHtml = `
      <div class="admin-detail-field" style="margin-top:16px;">
        <label>Refund</label>
        ${refundedAmt > 0 ? `<div style="margin-bottom:8px;">Refunded ${ugx(refundedAmt)}${o.refunded_at ? ' on ' + new Date(o.refunded_at).toLocaleDateString('en-UG', { dateStyle: 'medium' }) : ''}${o.refund_reason ? ' — ' + esc(o.refund_reason) : ''}</div>` : ''}
        ${refundFormOpen ? `
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="margin-bottom:0;"><label style="font-size:11px;">Amount (UGX)</label><input type="number" id="refundAmount" min="1" max="${o.total}" style="width:150px;" /></div>
            <div class="form-group" style="margin-bottom:0;flex:1;min-width:160px;"><label style="font-size:11px;">Reason</label><input type="text" id="refundReason" placeholder="e.g. Returned item" /></div>
            <button type="button" class="btn btn-primary" id="saveRefundBtn" style="padding:9px 16px;font-size:12.5px;">Record</button>
            <button type="button" class="btn btn-outline-navy" id="cancelRefundBtn" style="padding:9px 16px;font-size:12.5px;">Cancel</button>
          </div>
        ` : `<button type="button" id="openRefundBtn" style="background:none;border:none;color:var(--navy,#1a2b4c);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;">${refundedAmt > 0 ? 'Record another refund' : 'Record a refund'}</button>`}
      </div>`;

    tr.innerHTML = `
      <td colspan="12">
        <div class="admin-detail-inner">
          <div class="admin-detail-grid">
            <div class="admin-detail-field"><label>Email</label><div>${o.customer_email ? esc(o.customer_email) : '—'}</div></div>
            <div class="admin-detail-field"><label>Payment Reference</label><div>${esc(o.payment_tx_ref) || '—'}</div></div>
            <div class="admin-detail-field"><label>Subtotal</label><div>${ugx(o.subtotal)}${o.discount_amount ? ` <span style="color:var(--text-muted);">(−${ugx(o.discount_amount)} ${esc(o.coupon_code) || 'discount'})</span>` : ''}</div></div>
            <div class="admin-detail-field"><label>Order ID</label><div style="font-size:11.5px;color:var(--text-muted);">${esc(o.id)}</div></div>
          </div>
          <a href="/admin/orders/receipt.html?id=${encodeURIComponent(o.id)}" target="_blank" style="font-size:12.5px;font-weight:600;color:var(--navy,#1a2b4c);text-decoration:underline;">View / print payment receipt →</a>
          ${detailsHtml}
          ${refundHtml}
          <div class="admin-detail-field" style="margin-top:14px;"><label>Items</label>
            <div class="admin-detail-items">${itemsHtml}</div>
          </div>
        </div>
      </td>`;

    if (isEditing) {
      tr.querySelector('#saveDetailsBtn').addEventListener('click', () => saveOrderDetails(o.id));
      tr.querySelector('#cancelDetailsBtn').addEventListener('click', () => { editingDetailsId = null; renderOrders(); });
    } else {
      tr.querySelector('#editDetailsBtn').addEventListener('click', () => { editingDetailsId = o.id; renderOrders(); });
    }
    if (refundFormOpen) {
      tr.querySelector('#saveRefundBtn').addEventListener('click', () => saveRefund(o));
      tr.querySelector('#cancelRefundBtn').addEventListener('click', () => { refundFormOpenId = null; renderOrders(); });
    } else {
      tr.querySelector('#openRefundBtn').addEventListener('click', () => { refundFormOpenId = o.id; renderOrders(); });
    }
    return tr;
  }

  async function saveOrderDetails(orderId) {
    const payload = {
      customer_phone: document.getElementById('editPhone').value.trim(),
      delivery_address: document.getElementById('editAddress').value.trim(),
      notes: document.getElementById('editNotes').value.trim(),
    };
    const { data, error } = await supabaseClient.from('orders').update(payload).eq('id', orderId).select();
    if (error) { showToast('Could not save: ' + error.message, 'error'); return; }
    if (!data || !data.length) { showToast('Nothing was saved — check your admin permissions.', 'error'); return; }
    showToast('Delivery details updated.');
    editingDetailsId = null;
    loadOrders();
  }

  async function saveRefund(o) {
    const amount = Number(document.getElementById('refundAmount').value);
    const reason = document.getElementById('refundReason').value.trim();
    if (!amount || amount <= 0) { showToast('Enter a refund amount.', 'error'); return; }
    const newRefunded = Number(o.refunded_amount || 0) + amount;
    if (newRefunded > o.total) { showToast(`Refunds can't exceed the order total (${ugx(o.total)}).`, 'error'); return; }
    const { data, error } = await supabaseClient.from('orders').update({
      refunded_amount: newRefunded,
      refund_reason: reason || o.refund_reason || null,
      refunded_at: new Date().toISOString(),
    }).eq('id', o.id).select();
    if (error) { showToast('Could not record refund: ' + error.message, 'error'); return; }
    if (!data || !data.length) { showToast('Nothing was saved — check your admin permissions.', 'error'); return; }
    showToast('Refund recorded.');
    refundFormOpenId = null;
    loadOrders();
  }

  document.getElementById('orderSearch').addEventListener('input', () => { currentPage = 1; renderOrders(); });
  document.getElementById('dateFrom').addEventListener('change', () => { currentPage = 1; renderOrders(); });
  document.getElementById('dateTo').addEventListener('change', () => { currentPage = 1; renderOrders(); });

  document.getElementById('statusTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.admin-filter-tab');
    if (!btn) return;
    activeStatus = btn.dataset.status;
    currentPage = 1;
    document.querySelectorAll('#statusTabs .admin-filter-tab').forEach(b => b.classList.toggle('active', b === btn));
    renderOrders();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const orders = visibleOrders();
    if (!orders.length) { showToast('Nothing to export.', 'error'); return; }
    exportCsv('orders.csv', orders, [
      { label: 'Date', value: o => fmtDate(o.created_at) },
      { label: 'Customer', value: o => o.customer_name },
      { label: 'Phone', value: o => o.customer_phone },
      { label: 'Email', value: o => o.customer_email || '' },
      { label: 'Items', value: o => (o.order_items || []).map(i => `${i.product_name} x${i.quantity}`).join('; ') },
      { label: 'Delivery Address', value: o => o.delivery_address },
      { label: 'Notes', value: o => o.notes || '' },
      { label: 'Total (UGX)', value: o => o.total },
      { label: 'Payment', value: o => o.payment_provider === 'cod' ? 'Cash on Delivery' : 'Online' },
      { label: 'Status', value: o => STATUS_LABELS[o.status] || o.status },
    ]);
    showToast(`Exported ${orders.length} order${orders.length === 1 ? '' : 's'}.`);
  });

  loadOrders().then(() => wireDeepLinkSearch('orderSearch'));
</script>
<script src="/assets/script.js" defer></script>
</body>
</html>
