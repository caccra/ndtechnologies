<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — ND Electronic Technologies Ltd</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="stylesheet" href="/assets/admin.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <a href="/" class="brand" id="navBrand"></a>
    <h1>Admin Login</h1>
    <p>Sign in to manage products and orders.</p>
    <div class="admin-error" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
    </form>
  </div>
</div>

<script src="/assets/script.js" defer></script>
<script src="/assets/supabase-config.js"></script>
<script>
  (async function () {
    try {
      const { data: { session } } = await supabaseAuthClient.auth.getSession();
      if (session) window.location.href = '/admin/';
    } catch (err) {
      // Not fatal — worst case the login form just shows instead of
      // auto-redirecting a user who was already signed in.
      console.error('Admin login: session check failed:', err);
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('loginError');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseAuthClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
        return;
      }

      // Valid credentials don't mean admin — this is the same Auth user pool
      // as customer accounts. Check the profile flag before letting them in.
      // maybeSingle (not single) — a missing profile row must show a clear,
      // distinct message, not throw and fall through to a misleading one.
      const { data: profile, error: profileError } = await supabaseClient.from('profiles').select('is_admin').eq('id', data.user.id).maybeSingle();
      if (profileError) {
        console.error('Admin login: profile lookup failed:', profileError);
        await supabaseAuthClient.auth.signOut();
        errorBox.textContent = 'Could not verify admin access (' + profileError.message + '). This usually means the database policies need to be re-applied — see SETUP.md.';
        errorBox.style.display = 'block';
        return;
      }
      if (!profile) {
        await supabaseAuthClient.auth.signOut();
        errorBox.textContent = 'No profile record exists for this account yet — run the profiles insert from SETUP.md, then try again.';
        errorBox.style.display = 'block';
        return;
      }
      if (!profile.is_admin) {
        await supabaseAuthClient.auth.signOut();
        errorBox.textContent = 'This account does not have admin access.';
        errorBox.style.display = 'block';
        return;
      }

      window.location.href = '/admin/';
    } catch (err) {
      console.error('Admin login failed:', err);
      errorBox.textContent = 'Something went wrong signing you in (' + (err.message || 'unknown error') + '). Please try again.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
